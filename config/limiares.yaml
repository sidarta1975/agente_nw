agrupamento:
  cosseno_mesmo_assunto: 0.77     # calibrar no brief 007
  cosseno_republicacao: 0.94
  divergencia_minima_fonte_independente: 0.08
  janela_dias: 7
  itens_para_dividir: 12
qualificacao:
  substancial_minimo: 0.6
  conversavel_minimo: 0.6
  teto_por_dia: 40
conector:
  adjacencia_minima: 0.55         # calibrar no brief 009
  conversavel_viavel: 0.8         # calibrar no brief 009
  peso_aderencia_contato: 50
  peso_aderencia_usuario: 30
  peso_conversavel: 20
  peso_nivel: {dominio: 1.0, interesse: 0.7, curiosidade: 0.4}
  candidatos_por_contato: 10
  itens_no_menu: 5
  consulta:                       # caminho por consulta (briefs 034/035); calibrar com assunto_contato.aderencia_consulta
    minima: 0.45
    peso_consulta: 50
    peso_contato: 25
    peso_usuario: 10
    peso_conversavel: 15
    selecao_peso_consulta: 0.7
    selecao_peso_contato: 0.3
coleta:
  teaser_minimo_caracteres: 400
  dias_max_primeira_aparicao: 7
  retencao_texto_dias: 90
  intervalo_google_news_segundos: 2
  dias_alerta_feed_vazio: 2
  cooldown_bloqueio_minutos: 180    # após 429/503 o host não recebe pedido por este tempo
  max_consultas_por_pedido: 4       # buscas de notícia por pedido (assunto, contato, termos_busca, interessa)
  horas_reuso_termo: 24             # termo buscado há menos que isto não vai de novo à rede
  candidatos_suficientes: 10        # notícias novas que bastam: as buscas seguintes não são abertas
  usar_fonte_alternativa: true      # Google bloqueado -> Bing News RSS (sem chave)
  minutos_reaproveitamento: 120     # correção em texto reaproveita a coleta feita há menos que isto
  maximo_itens_novos_por_feed: 15  # notícias novas por feed em cada coleta (as mais recentes)
  tempo_maximo_segundos: 240  # teto de uma coleta; passado isso ela para e segue com o que já tem
  maximo_blocos_por_rede: 10      # blocos lidos por rede do contato; cada um custa uma chamada ao modelo
  maximo_imagens_por_rede: 8      # imagens publicadas descritas por rede (modelo de visão); 0 = não lê
  largura_minima_imagem: 250      # abaixo disso é ícone ou foto de perfil, não publicação
cartao:
  teto_por_dia: 40
listas:
  maximo_entradas: 2000
  pausa_rolagem_s: 1.5
  validade_dias: 30
  similaridade_minima: 0.8
  maximo_parecidas: 5
  similaridade_contato_forcado: 0.5  # --contato com nome muito diferente do pedido pede confirmação
  rodadas_sem_novidade: 6         # listas que carregam aos poucos (Instagram) pedem mais paciência
  redes_so_por_link: []           # redes que a extensão não deve ler sozinha (ex.: [x]); vazio = todas automáticas
extensao:                         # brief 044: leitura de rede social pelo Chrome do usuário
  tempo_limite_tarefa_s: 60
  pausa_entre_paginas_s: 2.0
  maximo_caracteres_pagina: 200000
  textos_botao_mostrar_mais: [mostrar mais, ver mais, carregar mais, show more, load more]
  aba_em_segundo_plano: false     # false = a aba abre em foco (se a rede carregar pela metade em segundo plano)
  espera_extensao_s: 20
  espera_render_s: 8              # redes que desenham a página depois de carregar (X, Instagram)
  navegador_app: Google Chrome    # macOS: aplicativo que abre a aba da ponte (o navegador padrão pode ser outro)
  navegador_perfil: Default       # perfil do Chrome em que a extensão está instalada (pasta em ~/Library/Application Support/Google/Chrome)

redacao:                          # brief 046
  meses_fato_antigo: 12           # fato mais velho que isto vai ao prompt marcado [antigo]
